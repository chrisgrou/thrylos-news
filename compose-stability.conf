// Classes the Compose compiler should treat as stable.
//
// The domain model lives in :core:model, a plain Kotlin module with no Compose
// compiler plugin, so Compose can't infer anything about it and assumes the worst.
// On top of that, several of these hold a List (Article.content, FilterRule.conditions),
// and a read-only List is inferred unstable regardless of module.
//
// The consequence is that every composable taking one of these as a parameter is
// non-skippable — ArticleCard, RuleDescription, ConditionBadge and friends all
// recompose whenever their parent does, even when the value they were handed is
// identical.
//
// The promise this makes is honest here: every one of these is a data class of vals,
// constructed once and never mutated. The one exception worth naming is
// ArticleMapper.LazyContentBlocks, the deferred-decode List behind Article.content —
// its equals/hashCode are defined on the raw JSON that produced it, so comparing two
// of them is consistent and doesn't force a decode.
gr.thrylos.news.model.*
