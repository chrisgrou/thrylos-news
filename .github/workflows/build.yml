name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests (core:model, core:sources)
        run: ./gradlew :core:model:test :core:sources:test

      - name: Lint
        run: ./gradlew lint

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: thrylos-news-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Powers in-app update checks (Settings → Έλεγχος για ενημερώσεις): the app
      # polls this fixed "latest" release's tag/assets, so every push to a branch
      # replaces it rather than accumulating a release per commit.
      - name: Publish "latest" release for in-app updates
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk_src=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          apk_name="thrylos-news-${GITHUB_RUN_NUMBER}.apk"
          cp "$apk_src" "$apk_name"

          before="${{ github.event.before }}"
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before" 2>/dev/null; then
            changelog=$(git log --pretty=format:"- %s" "$before"..${{ github.sha }})
          fi
          if [ -z "$changelog" ]; then
            changelog=$(git log -1 --pretty=format:"- %s" ${{ github.sha }})
          fi
          notes=$(printf 'Build #%s\n\n%s' "$GITHUB_RUN_NUMBER" "$changelog")

          gh release delete latest --yes --cleanup-tag -R "${{ github.repository }}" || true
          gh release create latest "$apk_name" \
            -R "${{ github.repository }}" \
            --title "Latest build (#${GITHUB_RUN_NUMBER})" \
            --notes "$notes" \
            --prerelease \
            --target "${{ github.sha }}"
